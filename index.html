<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nolan's Communication Board</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            /* Background is now set dynamically by JavaScript based on the season */
            min-height: 100vh; /* Ensures the background covers the whole screen */
            margin: 0;
            padding: 20px;
            /* Prevent text selection and magnifier when tapping quickly or long-pressing */
            user-select: none; 
            -webkit-user-select: none; /* specifically for Apple devices */
            -webkit-touch-callout: none; /* stops the long-press popup menu */
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        /* We use a 'Grid' to automatically arrange the cards nicely */
        .board {
            display: grid;
            /* This makes columns that adapt to the screen size automatically */
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            margin-bottom: 80px; /* Leave space at the bottom for the fixed Next Page button */
        }

        .card {
            background-color: white; /* Default fallback */
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            border: 4px solid transparent;
            transition: transform 0.1s, box-shadow 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        /* Color-coding Categories */
        .bg-core {
            background-color: #e3f2fd; /* Light Blue for Core Words */
            border-color: #bbdefb;
        }
        .bg-food {
            background-color: #fff9c4; /* Light Yellow for Food/Drink */
            border-color: #fff59d;
        }
        .bg-activity {
            background-color: #e8f5e9; /* Light Green for Activities */
            border-color: #c8e6c9;
        }

        /* Active/Tap states for colored cards */
        .card.bg-core:active { background-color: #bbdefb; border-color: #2196f3; }
        .card.bg-food:active { background-color: #fff59d; border-color: #ffb300; }
        .card.bg-activity:active { background-color: #c8e6c9; border-color: #4caf50; }

        /* Generic active state for any uncolored cards */
        .card:not(.bg-core):not(.bg-food):not(.bg-activity):active {
            transform: scale(0.90);
            border-color: #4CAF50;
            background-color: #e8f5e9;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
        }
        
        /* Make sure all cards squish when pressed */
        .card:active {
            transform: scale(0.90);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
        }

        .emoji {
            font-size: 58px; /* Increased size by about 15% */
            margin-bottom: 10px;
        }

        /* Styling for real picture files */
        .card-img {
            width: 75px; 
            height: 75px;
            object-fit: contain; /* Keeps the picture from stretching */
            margin-bottom: 10px;
            pointer-events: none; /* Stops the iPad from trying to "drag" the image */
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Styling for the isolated Next Page button */
        .navigation-bar {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none; /* Let touches fall through the bar to the background... */
            z-index: 10;
        }

        .nav-btn {
            background-color: #ffffff;
            border-radius: 50px; /* Pill shape */
            padding: 15px 40px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 4px solid transparent;
            transition: transform 0.1s, background-color 0.1s;
            pointer-events: auto; /* ...but catch touches on the button itself! */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .nav-btn:active {
            transform: scale(0.90);
            background-color: #fff3e0;
            border-color: #ff9800;
        }

        /* --- Autumn Leaves Animation Styles --- */
        .leaf {
            position: fixed;
            top: -10%;
            z-index: -1; /* Keeps leaves floating BEHIND the buttons so they don't block taps */
            user-select: none;
            pointer-events: none; /* Ensures taps go straight through the leaves to the buttons */
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(100px, 110vh) rotate(360deg);
                opacity: 0;
            }
        }
        /* --- Fun Background Animations --- */
        .fun-plane, .fun-plane2 {
            position: fixed;
            width: 16.66vw; /* 1/6th of the screen width */
            object-fit: contain; /* Prevents the image from stretching */
            z-index: -2; /* Stays far behind everything */
            pointer-events: none; /* Stops it from blocking taps */
            user-select: none;
            -webkit-user-drag: none;
            opacity: 0; /* Hidden by default until JS triggers it */
            transition: opacity 1s;
        }

        .fun-train {
            position: fixed;
            bottom: 2%;
            right: -300px;
            font-size: 55px;
            z-index: -2;
            pointer-events: none;
            user-select: none;
            animation: driveTrain 45s linear infinite;
            animation-delay: 15s; /* Delays the train so they don't always appear at the same time */
        }

        @keyframes driveTrain {
            0% { right: -300px; }
            20% { right: 110vw; } 
            100% { right: 110vw; }
        }
    </style>
</head>
<!-- Adding ontouchstart allows iPads to instantly recognize the 'squish' tap animation -->
<!-- oncontextmenu="return false;" stops the long-press right-click menu entirely -->
<body ontouchstart="" oncontextmenu="return false;">

    <!-- Fun Background Animations -->
    <img src="images/plane.png" class="fun-plane" alt="Flying Plane">
    <img src="images/plane2.png" class="fun-plane2" alt="Flying Plane 2">
    <div class="fun-train">🚂🚋🚋</div>

    <h1>Nolan's Communication Board</h1>

    <div class="board">
        <!-- Core Words -->
        <div class="card bg-core" onmousedown="speak('Yes')" ontouchstart="speak('Yes')">
            <div class="emoji">✅</div>
            Yes
        </div>
        <div class="card bg-core" onmousedown="speak('No')" ontouchstart="speak('No')">
            <div class="emoji">❌</div>
            No
        </div>
        <div class="card bg-core" onmousedown="speak('Help please')" ontouchstart="speak('Help please')">
            <div class="emoji">🤝</div>
            Help
        </div>
        <div class="card bg-core" onmousedown="speak('More')" ontouchstart="speak('More')">
            <div class="emoji">➕</div>
            More
        </div>
        <div class="card bg-core" onmousedown="speak('All done')" ontouchstart="speak('All done')">
            <img src="images/all done.png" alt="All Done" class="card-img">
            All Done
        </div>
        <div class="card bg-core" onmousedown="speak('I need to use the bathroom')" ontouchstart="speak('I need to use the bathroom')">
            <div class="emoji">🚽</div>
            Bathroom
        </div>

        <!-- Food & Drink -->
        <div class="card bg-food" onmousedown="speak('Banana')" ontouchstart="speak('Banana')">
            <div class="emoji">🍌</div>
            Banana
        </div>
        <div class="card bg-food" onmousedown="speak('Apple juice')" ontouchstart="speak('Apple juice')">
            <img src="images/juice.png" alt="Apple Juice" class="card-img">
            Apple Juice
        </div>
        <div class="card bg-food" onmousedown="speak('Milk')" ontouchstart="speak('Milk')">
            <img src="images/milk.png" alt="Milk" class="card-img">
            Milk
        </div>

        <!-- Activities -->
        <div class="card bg-activity" onmousedown="speak('I want to go for a bike ride')" ontouchstart="speak('I want to go for a bike ride')">
            <div class="emoji">🚲</div>
            Bike Ride
        </div>
        <div class="card bg-activity" onmousedown="speak('I want to listen to music')" ontouchstart="speak('I want to listen to music')">
            <img src="images/music.png" alt="Music" class="card-img">
            Music
        </div>
        <div class="card bg-activity" onmousedown="speak('I want to watch TV')" ontouchstart="speak('I want to watch TV')">
            <div class="emoji">📺</div>
            TV
        </div>
        <div class="card bg-activity" onmousedown="speak('I want to go to the park')" ontouchstart="speak('I want to go to the park')">
            <img src="images/park.png" alt="Park" class="card-img">
            Park
        </div>
        <div class="card bg-activity" onmousedown="speak('I want to go on the swing')" ontouchstart="speak('I want to go on the swing')">
            <img src="images/swing.jpg" alt="Swing" class="card-img">
            Swing
        </div>
        <div class="card bg-activity" onmousedown="speak('Ms. Rachel')" ontouchstart="speak('Ms. Rachel')">
            <img src="images/ms rachel.jpg" alt="Ms Rachel" class="card-img">
            Ms. Rachel
        </div>
        <div class="card bg-activity" onmousedown="speak('TV Songs')" ontouchstart="speak('TV Songs')">
            <img src="images/super simple.jpg" alt="Super Simple" class="card-img">
            TV Songs
        </div>
    </div>
    
    <!-- Isolated Navigation Bar at the bottom of the screen -->
    <div class="navigation-bar">
        <div class="nav-btn" onmousedown="playMagicSound(); changePage()" ontouchstart="playMagicSound(); changePage()">
            ✨ Next Page
        </div>
    </div>

    <script>
        // Store the available voices
        let availableVoices = [];
        let lastSpeakTime = 0;

        // --- Web Audio API (For Sound Effects) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playMagicSound() {
            // Stop any currently speaking speech so the sound effect is clear
            window.speechSynthesis.cancel();
            
            // Wake up the audio context if iOS put it to sleep
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            
            // Play a quick, pleasing 3-note chime (C5, E5, G5)
            playTone(523.25, now, 0.1); 
            playTone(659.25, now + 0.1, 0.15); 
            playTone(783.99, now + 0.2, 0.3); 
        }

        function playTone(frequency, startTime, duration) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine'; // Smooth, bell-like tone
            osc.frequency.setValueAtTime(frequency, startTime);
            
            // Fade the volume in and out smoothly so it doesn't click
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        // This function loads the voices from the device
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }

        // Browsers sometimes take a second to load voices, so we tell it to listen for them
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); // Try loading them immediately too

        // --- Screen Wake Lock (Keep screen on) ---
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                // Check if the browser supports Wake Lock API
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    
                    // Re-request if the lock is lost (e.g. user switches tabs and comes back)
                    wakeLock.addEventListener('release', () => {
                        console.log('Screen Wake Lock released');
                    });
                }
            } catch (err) {
                console.error('Wake Lock error:', err);
            }
        }

        // Request it when the app loads, and re-request it when they tap the screen 
        // (Browsers often require a user interaction first to allow keeping the screen on)
        window.addEventListener('load', requestWakeLock);
        document.addEventListener('touchstart', requestWakeLock, { once: true });
        document.addEventListener('mousedown', requestWakeLock, { once: true });

        // Also re-request when the app comes back from being minimized
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        // --- iOS 15 Audio Fixes ---
        let isAudioUnlocked = false;

        // Make sure we unlock the AudioContext on first touch too!
        document.addEventListener('touchstart', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });

        function speak(text) {
            // Prevent double-firing from touch and mouse events (Safari triggers both about 300ms apart)
            if (Date.now() - lastSpeakTime < 500) return;
            lastSpeakTime = Date.now();
            
            // First time a button is pressed, start the "keep alive" interval
            if (!isAudioUnlocked) {
                isAudioUnlocked = true;
                // Every 10 seconds, briefly pause and resume to prevent iOS from sleeping the audio engine
                setInterval(() => {
                    window.speechSynthesis.pause();
                    window.speechSynthesis.resume();
                }, 10000);
            }

            // ALWAYS cancel any stuck speech before starting a new one
            window.speechSynthesis.cancel();
            
            // Wrap the actual speech in a 50-millisecond delay.
            // On iOS 15, if you cancel and speak in the exact same millisecond, the engine crashes and goes silent!
            setTimeout(() => {
                let utterance = new SpeechSynthesisUtterance(text);
                
                // Look for a higher quality built-in voice
                if (availableVoices.length > 0) {
                    let bestVoice = availableVoices.find(voice => voice.name.includes('Siri') || voice.name === 'Alex' || voice.name === 'Samantha') 
                                 || availableVoices.find(voice => voice.lang === 'en-US');
                    
                    if (bestVoice) {
                        utterance.voice = bestVoice;
                    }
                }
                
                utterance.rate = 0.9; // Slightly slower for clarity
                
                window.speechSynthesis.speak(utterance);
                
                // CRITICAL FOR IOS 15: Force the engine to resume immediately after queueing the speech
                window.speechSynthesis.resume();
            }, 50);
        }

        // --- Seasonal Theme & Animation Logic ---
        function setSeasonalTheme() {
            // Get the current month (0 = January, 11 = December)
            const month = new Date().getMonth(); 
            let emojis = [];
            let background = '';

            // Ottawa (Northern Hemisphere) Seasons
            if (month === 11 || month === 0 || month === 1) { 
                // Winter: Dec, Jan, Feb
                emojis = ['❄️', '🌨️', '⛄'];
                background = 'linear-gradient(to bottom, #e0f7fa, #b2ebf2)'; // Icy blue
            } else if (month >= 2 && month <= 4) { 
                // Spring: Mar, Apr, May
                emojis = ['🌸', '🌷', '🌱'];
                background = 'linear-gradient(to bottom, #fce4ec, #f8bbd0)'; // Soft pink
            } else if (month >= 5 && month <= 7) { 
                // Summer: Jun, Jul, Aug
                emojis = ['☀️', '🌻', '🦋'];
                background = 'linear-gradient(to bottom, #e1f5fe, #fff9c4)'; // Blue sky & warm yellow
            } else { 
                // Autumn: Sep, Oct, Nov
                emojis = ['🍂', '🍁', '🍃'];
                background = 'linear-gradient(to bottom, #ffebd2, #ffb38a)'; // Warm orange
            }

            // Apply the background color
            document.body.style.background = background;

            // Generate the falling animation
            const container = document.body;
            for (let i = 0; i < 25; i++) {
                let item = document.createElement('div');
                item.className = 'leaf'; // Reusing the same animation CSS class
                
                item.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                item.style.left = Math.random() * 100 + 'vw';
                item.style.animationDuration = Math.random() * 5 + 6 + 's'; 
                item.style.animationDelay = Math.random() * 5 + 's'; 
                item.style.fontSize = Math.random() * 15 + 20 + 'px'; 
                
                container.appendChild(item);
            }
        }
        
        // Run the theme checker when the page loads
        window.addEventListener('load', setSeasonalTheme);

        // --- Magic Next Page Logic ---
        let lastPageChangeTime = 0;
        let originalOrder = []; // Store the original layout
        let resetTimeout = null;

        // Save the default order right when the page loads
        window.addEventListener('load', () => {
            const board = document.querySelector('.board');
            originalOrder = Array.from(board.querySelectorAll('.card'));
        });

        function changePage() {
            // Prevent double-firing from Safari's touch+mouse events
            if (Date.now() - lastPageChangeTime < 500) return;
            lastPageChangeTime = Date.now();

            // Clear any existing reset timer since they just pressed the button again
            if (resetTimeout) clearTimeout(resetTimeout);

            // 1. Change the theme colors and falling particles randomly
            const themes = [
                { bg: 'linear-gradient(to bottom, #e0f7fa, #b2ebf2)', emojis: ['❄️', '🌨️', '⛄'] }, // Winter
                { bg: 'linear-gradient(to bottom, #fce4ec, #f8bbd0)', emojis: ['🌸', '🌷', '🌱'] }, // Spring
                { bg: 'linear-gradient(to bottom, #e1f5fe, #fff9c4)', emojis: ['☀️', '🌻', '🦋'] }, // Summer
                { bg: 'linear-gradient(to bottom, #ffebd2, #ffb38a)', emojis: ['🍂', '🍁', '🍃'] }, // Autumn
                { bg: 'linear-gradient(to bottom, #e8eaf6, #c5cae9)', emojis: ['⭐', '🌙', '✨'] }, // Night Space
                { bg: 'linear-gradient(to bottom, #e8f5e9, #a5d6a7)', emojis: ['🐸', '🐢', '🦕'] }  // Dino/Frog
            ];
            const newTheme = themes[Math.floor(Math.random() * themes.length)];
            
            document.body.style.background = newTheme.bg;
            
            const leaves = document.querySelectorAll('.leaf');
            leaves.forEach(leaf => {
                leaf.innerText = newTheme.emojis[Math.floor(Math.random() * newTheme.emojis.length)];
            });

            // 2. Shuffle the cards to make a "new page" feel
            const board = document.querySelector('.board');
            const cards = Array.from(board.querySelectorAll('.card'));
            
            // Fisher-Yates shuffle algorithm
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                board.insertBefore(cards[j], cards[i]);
            }

            // 3. Set a timer to automatically reset everything after 5 seconds
            resetTimeout = setTimeout(() => {
                // Restore the background based on the actual season
                setSeasonalTheme();
                
                // Put all the cards back in their exact original order
                originalOrder.forEach(card => board.appendChild(card));
            }, 5000);
        }

        // --- Random Flying Plane Logic ---
        function launchPlane() {
            const plane1 = document.querySelector('.fun-plane');
            const plane2 = document.querySelector('.fun-plane2');
            
            // Randomly choose which plane to fly this time (50/50 chance)
            const isPlane1 = Math.random() > 0.5;
            const activePlane = isPlane1 ? plane1 : plane2;
            
            // Randomize starting and ending heights (between 5% and 40% from the top)
            const startY = Math.random() * 35 + 5; 
            const endY = startY - (Math.random() * 15 + 5); // Tends to fly slightly upwards
            
            // Randomize the flight speed (between 8 and 15 seconds to cross the screen)
            const flightTime = Math.random() * 7 + 8;

            // Reset the chosen plane to its starting position, hidden
            activePlane.style.transition = 'none';
            activePlane.style.opacity = '1';
            
            if (isPlane1) {
                activePlane.style.left = '-20vw'; // Plane 1 starts on the left
                // Ensure it faces right
                activePlane.style.transform = 'scaleX(1)';
            } else {
                activePlane.style.left = '110vw'; // Plane 2 starts on the right
                // Optional: if plane2 naturally points right, we can flip it left by uncommenting the next line
                // activePlane.style.transform = 'scaleX(-1)'; 
            }
            activePlane.style.top = startY + 'vh';

            // Wait a tiny bit for the CSS to reset, then trigger the animation
            setTimeout(() => {
                activePlane.style.transition = `left ${flightTime}s linear, top ${flightTime}s linear`;
                
                if (isPlane1) {
                    activePlane.style.left = '110vw'; // Fly all the way across to the right
                } else {
                    activePlane.style.left = '-20vw'; // Fly all the way across to the left
                }
                
                activePlane.style.top = endY + 'vh'; // Arrive at the new height
                
                // Hide it when it finishes
                setTimeout(() => {
                    activePlane.style.opacity = '0';
                }, flightTime * 1000);
            }, 50);

            // Schedule the next flight randomly between 20 and 45 seconds from now
            const nextFlightDelay = Math.random() * 25000 + 20000;
            setTimeout(launchPlane, nextFlightDelay);
        }

        // Start the random plane flights shortly after loading
        window.addEventListener('load', () => {
            setTimeout(launchPlane, 5000); // First flight happens 5 seconds after app opens!
        });

    </script>

</body>
</html>
